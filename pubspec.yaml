name: fl_video
description: Adds Material and Cupertino style control panels for the video_player package, with subtitles, playback speed, live and fullscreen support.
version: 2.0.0
repository: https://github.com/Wayaer/fl_video.git
issue_tracker: https://github.com/Wayaer/fl_video/issues
topics:
  - video
  - video-player
  - media
  - player
  - ui

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  cupertino_ui: ^1.1.4
  material_ui: ^1.8.0
  video_player: ^2.14.1
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
