name: app
description: Demonstrates how to use the fl_video plugin.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  fl_video:
    path: ../
  cupertino_ui: ^1.1.4
  material_ui: ^1.8.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
